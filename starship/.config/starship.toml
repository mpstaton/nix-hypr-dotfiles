# Port of oh-my-posh themes/my-tokyo.omp.json (the ACTIVE Mac theme, selected
# in zsh/zshrc) to starship.
#
# NOT a port of oh-my-posh/config.json — that is the legacy March-2025
# powerline/diamond design and its own README says do not port it.
#
# Palette, per the theme's README:
#   #7eb8da structure blue   #ffa5d8 pink (git, project, kubectl)
#   #98bfad sage (path)      #be9ddf lavender (perf)
#   #ffffff icons            #ffff00 yellow (cloud values, root)
#
# Two deliberate departures from the Mac original, both from its own porting
# notes: the Apple logo in the session block is swapped for the NixOS
# snowflake, and the font must be named explicitly rather than relying on
# macOS font fallback (ghostty here is already set to JetBrainsMono Nerd Font).
#
# One structural limit: oh-my-posh right-aligns block 4 as its own line.
# starship's right_format renders at the right of the LAST prompt line only,
# so the perf cluster sits opposite the `└─>` rather than on its own row.

format = """
[┏](#7eb8da)$hostname$username$time
[┣](#7eb8da)$package$aws$gcloud$azure$kubernetes$git_branch$git_status$git_state
[┣](#7eb8da)$directory
[└─](#7eb8da)$status$character"""

right_format = "$cmd_duration$memory_usage$battery"

add_newline = true

# ── Block 1: session + timestamp ────────────────────────────────────
[hostname]
disabled = false
ssh_only = false
format = '[\[](#7eb8da)[ ](#ffffff)[:](#7eb8da)[$hostname](#7eb8da)'

[username]
show_always = true
format = '[:](#7eb8da)[ ](#ffffff)[$user](#7eb8da)[\]](#7eb8da)'
style_user = "#7eb8da"
style_root = "#ffff00"

[time]
disabled = false
time_format = "%Y%m%d@%H:%M:%S"
format = '[\[](#7eb8da)[ ](#ffffff)[$time](#7eb8da)[\]](#7eb8da)'

# ── Block 2: project, cloud, git ────────────────────────────────────
[package]
format = '[\[](#ffa5d8)[ ](#ffffff)[$version](#ffa5d8)[\]](#ffa5d8)'

[aws]
format = '[\[](#7eb8da)[ ](#ffffff)[$profile(@$region)](#ffff00)[\]](#7eb8da)'

[gcloud]
format = '[\[](#7eb8da)[ ](#ffffff)[$project(::$account)](#ffff00)[\]](#7eb8da)'

[azure]
format = '[\[](#7eb8da)[ ](#ffffff)[Subscription: $subscription](#ffff00)[\]](#7eb8da)'

[kubernetes]
disabled = false
format = '[\[](#ffa5d8)[ ](#ffffff)[$context(::$namespace)](#ffff00)[\]](#ffa5d8)'

[git_branch]
format = '[\[](#ffa5d8)[$symbol](#ffffff)[$branch](#ffa5d8)'
symbol = " "

[git_status]
format = '([ $all_status$ahead_behind](#ffa5d8))[\]](#ffa5d8)'
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
up_to_date = "≡"
modified = " ~${count}"
staged = " +${count}"
untracked = " ?${count}"
deleted = " ✘${count}"
stashed = "  ${count}"
conflicted = " ！${count}"

[git_state]
format = '[\[$state( $progress_current/$progress_total)\]](#ffa5d8)'

# ── Block 3: path ───────────────────────────────────────────────────
[directory]
format = '[\[](#7eb8da)[ ](#ffffff)[$path](#98bfad)[$read_only]($read_only_style)[\]](#7eb8da)'
truncation_length = 0
truncate_to_repo = false
read_only = "  "
read_only_style = "#f36943"

# ── Block 4: perf cluster, right-aligned ────────────────────────────
[cmd_duration]
min_time = 0
show_milliseconds = true
format = '[\[](#be9ddf)[ ](#ffffff)[$duration](#be9ddf)[\]](#be9ddf)'

[memory_usage]
disabled = false
threshold = -1
format = '[\[](#be9ddf)[ ](#ffffff)[RAM: $ram](#be9ddf)[\]](#be9ddf)'

[battery]
format = '[\[$symbol$percentage\]]($style)'

[[battery.display]]
threshold = 100
style = "#f36943"

# ── Block 5: prompt line ────────────────────────────────────────────
[status]
disabled = false
format = '[\[Error, check your command\]](#ffa5d8) '
map_symbol = false

[character]
success_symbol = "[>](#7eb8da)"
error_symbol = "[>](#ffa5d8)"
vicmd_symbol = "[<](#98bfad)"
