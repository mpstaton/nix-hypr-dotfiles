# Port of dotfiles/oh-my-posh/config.json to starship.
# Palette: Night Owl ink #011627, cream #FEF5ED, blue #516BEB,
#          grey #575656 / #d6deeb, mint #17D7A0.
#
# Nerd Font glyphs are written as \uXXXX escapes (TOML basic strings only).
#    /   round powerline caps
#    nix   apple   ubuntu   linux
#    memory   git branch   home   folder
#    arrow   lock   staged   stash

format = """
[](fg:#FEF5ED)\
[ mps ](fg:#011627 bg:#FEF5ED)\
$os\
$shell\
[](fg:#FEF5ED)\
$memory_usage\
$cmd_duration\
$line_break\
[╭─](fg:#FEF5ED)\
$time\
$username\
$directory\
$line_break\
[╰─ ](fg:#FEF5ED)\
$character"""

# Right-aligned git block. Only renders in fish/zsh/nushell, not bash.
right_format = "$git_branch$git_status"

[os]
disabled = false
format = "[$symbol ](fg:#011627 bg:#FEF5ED)"

[os.symbols]
NixOS = ""
Macos = ""
Ubuntu = ""
Linux = ""

[shell]
disabled = false
format = "[ $indicator ](fg:#011627 bg:#FEF5ED)"
fish_indicator = "fish"
bash_indicator = "bash"
zsh_indicator = "zsh"
nu_indicator = "nu"

# Caps live inside each module's own format so the whole segment
# appears and disappears as a unit — no orphaned half-circles.
[memory_usage]
disabled = false
threshold = -1
symbol = ""
format = "[](fg:#516BEB)[ $symbol MEM: $ram_pct | $ram ](fg:#ffffff bg:#516BEB)[](fg:#516BEB)"

[cmd_duration]
min_time = 0
show_milliseconds = true
format = "[](fg:#575656)[ $duration ](fg:#d6deeb bg:#575656)[](fg:#575656)"

[time]
disabled = false
time_format = "%H:%M"
format = "[ ♥ $time |]($style)"
style = "fg:#FEF5ED"

# OMP had a dedicated root segment; starship expresses it as username styling.
[username]
show_always = false
format = "[ $user ]($style)"
style_root = "bold red"
style_user = "fg:#FEF5ED"

[directory]
format = "[ $path ]($style)[$read_only]($read_only_style)"
style = "fg:#FEF5ED"
truncation_length = 4
truncate_to_repo = false
home_symbol = ""
read_only = " "

[directory.substitutions]
"/" = "  "

[character]
success_symbol = "[❯](#17D7A0)"
error_symbol = "[❯](red)"
vicmd_symbol = "[❮](#516BEB)"

[git_branch]
symbol = " "
format = "[](fg:#17D7A0)[ $symbol$branch](fg:#011627 bg:#17D7A0)"

[git_status]
format = "[( $all_status$ahead_behind) ](fg:#011627 bg:#17D7A0)[](fg:#17D7A0)"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
modified = "✎${count}"
staged = "${count}"
stashed = "${count}"
deleted = "✘${count}"
